    .empty { font: 600 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #59636e; }
    @media (prefers-color-scheme: dark) {
      .title,.label,.value { fill: #f0f6fc; }
      .subtitle,.axis,.empty { fill: #8c959f; }
      line { stroke: #30363d; }
