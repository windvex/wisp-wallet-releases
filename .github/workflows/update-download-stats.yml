name: Update APK download statistics

on:
  workflow_dispatch:
  release:
    types:
      - published
      - edited
      - released
      - prereleased
  schedule:
    - cron: "23 * * * *"
  push:
    branches:
      - main
    paths:
      - scripts/generate-download-stats.mjs
      - .github/workflows/update-download-stats.yml

permissions:
  contents: write

concurrency:
  group: apk-download-statistics
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Generate exact APK statistics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/generate-download-stats.mjs

      - name: Record verification summary
        if: always()
        shell: bash
        run: |
          {
            echo "### APK download statistics"
            echo
            echo "Checked at: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            echo
            if [ -f download-stats.json ]; then
              echo "Repository snapshot:"
              echo
              echo '```json'
              jq '{totalDownloads, totalVersions, versions: [.versions[] | {tag, downloads}]}' download-stats.json
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit changed statistics
        shell: bash
        run: |
          git add \
            DOWNLOADS.md \
            download-stats.json \
            assets/downloads-badge.svg \
            assets/downloads-by-version.svg

          if git diff --cached --quiet; then
            echo "Download counts have not changed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: update APK download statistics"
          git push
